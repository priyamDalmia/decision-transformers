# Training — see dt.config.TrainConfig for the schema.
# Values here override the dataclass defaults; unknown keys are rejected.

data_path: data/pendulum_random.pkl
checkpoint_path: data/checkpoints/rcbc_mlp.pt

epochs: 50
batch_size: 256
lr: 1.0e-3
weight_decay: 1.0e-4
grad_clip: 1.0
num_workers: 2

# Model. Pendulum actions live in [-2, 2].
hidden_dim: 128
n_layers: 3
action_low: -2.0
action_high: 2.0

seed: 0

# null -> use cuda when available, else cpu.
device: null
